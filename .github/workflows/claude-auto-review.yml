name: Claude Auto Code Review

# Automatically review PRs with Claude Code
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this PR comprehensively for the My Humanity Score (MHS) project.

            Focus on:
            1. **Code Quality**: Clean code, maintainability, readability
            2. **Security**: Vulnerabilities, input validation, auth/access control
            3. **Performance**: Bottlenecks, optimization opportunities
            4. **Testing**: Coverage, edge cases, test quality
            5. **Architecture**: Design patterns, SOLID principles
            6. **MHS Ethics**:
               - Ensure NO discrimination logic in scoring (religion, race, gender, nationality, etc.)
               - Verify scoring algorithm transparency
               - Check ethical considerations

            Reference the CLAUDE.md file for project-specific standards.
            Post your review as a PR comment with specific, actionable feedback.
          claude_args: |
            --model claude-sonnet-4-20250514
            --max-turns 5

      - name: Label critical issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // This runs after Claude's review
            // You can add custom logic here to parse Claude's review
            // and add labels based on severity

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const claudeComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Claude')
            );

            if (claudeComment) {
              const body = claudeComment.body.toLowerCase();

              // Check for critical keywords
              const criticalKeywords = [
                'critical security',
                'sql injection',
                'xss vulnerability',
                'authentication bypass',
                'discrimination',
                'bias in scoring'
              ];

              const foundCritical = criticalKeywords.some(keyword =>
                body.includes(keyword)
              );

              if (foundCritical) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['⚠️ needs-review', 'security']
                });
              }
            }
