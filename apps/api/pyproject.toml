[project]
name = "mhs-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "models", "schemas", "services", "routers", "tasks", "graph", "celery_app"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"
# Run with coverage: pytest --cov=. --cov-report=term-missing
# (coverage flags are omitted here so pytest works without pytest-cov installed locally)

[tool.coverage.run]
# "." = apps/api/ (the CWD when pytest runs, both in Docker and in CI)
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "celery_app.py",      # Celery bootstrap — no logic to test here
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60   # Realistic target for Sprint 1 (scoring + auth + users)
